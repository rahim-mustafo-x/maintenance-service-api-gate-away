spring.application.name=api-gateway
server.port=${PORT:8080}

# Eureka Discovery Client Setup
eureka.instance.status-page-url-path=/actuator/info
eureka.instance.health-check-url-path=/actuator/health
eureka.client.healthcheck.enabled=true
eureka.client.service-url.defaultZone=${EUREKA_URL}
eureka.instance.prefer-ip-address=true

# Actuator Endpoints Exposure
management.endpoints.web.exposure.include=health,info,prometheus,gateway

# SpringDoc Swagger UI Multi-Service Aggregation
springdoc.swagger-ui.urls[0].name=User Service
springdoc.swagger-ui.urls[0].url=/user-service/v3/api-docs

springdoc.swagger-ui.urls[1].name=Image Service
springdoc.swagger-ui.urls[1].url=/image-service/v3/api-docs

springdoc.swagger-ui.urls[2].name=Job Service
springdoc.swagger-ui.urls[2].url=/job-service/v3/api-docs

springdoc.swagger-ui.urls[3].name=Message Service
springdoc.swagger-ui.urls[3].url=/message-service/openapi.json

springdoc.swagger-ui.urls[4].name=Telegram Service
springdoc.swagger-ui.urls[4].url=/telegram-service/openapi.json