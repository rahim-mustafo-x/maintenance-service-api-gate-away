name: Deploy

on:
  push:
    branches:
      - master

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh

          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key

          chmod 600 ~/.ssh/deploy_key

          ssh-keyscan \
            "${{ secrets.DEPLOY_HOST }}" \
            >> ~/.ssh/known_hosts

      - name: Copy deployment files
        run: |
          scp \
            -i ~/.ssh/deploy_key \
            -r \
            Dockerfile \
            compose.yaml \
            .env.example \
            src \
            pom.xml \
            mvnw \
            .mvn \
            "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}:/opt/api-gateway/"

      - name: Deploy
        run: |
          ssh \
            -i ~/.ssh/deploy_key \
            "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" << 'EOF'

            set -e

            cd /opt/api-gateway

            cp .env.example .env

            sed -i \
              -e "s|^EUREKA_USERNAME=.*|EUREKA_USERNAME=${{ secrets.EUREKA_USERNAME }}|" \
              -e "s|^EUREKA_PASSWORD=.*|EUREKA_PASSWORD=${{ secrets.EUREKA_PASSWORD }}|" \
              -e "s|^EUREKA_URL=.*|EUREKA_URL=${{ secrets.EUREKA_URL }}|" \
              -e "s|^JWT_SECRET_KEY=.*|JWT_SECRET_KEY=${{ secrets.JWT_SECRET_KEY }}|" \
              -e "s|^PORT=.*|PORT=${{ secrets.PORT }}|" \
              .env

            chmod 600 .env

            docker compose up -d --build

            docker image prune -f

          EOF